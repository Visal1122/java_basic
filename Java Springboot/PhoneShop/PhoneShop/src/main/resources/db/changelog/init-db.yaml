databaseChangeLog:
  - changeSet:
      id: 001_init_db
      author: visalyang2011@gmail.com

      changes:

        - createTable:
            tableName: brands
            columns:
              - column:
                  name: brand_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: brand_name
                  type: varchar(50)

        - createTable:
            tableName: models
            columns:
              - column:
                  name: model_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: model_name
                  type: varchar(50)

              - column:
                  name: brand_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_models_brands
                    referencedTableName: brands
                    referencedColumnNames: brand_id